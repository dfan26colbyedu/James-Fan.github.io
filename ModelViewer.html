<!DOCTYPE html>
<html lang="en">
<head>
  <title>Hello</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
</head>

<body>


<h1 id="title">3D Model Viewer</h1>


<p id="description">
  Models of the Procedurally Generated Norian Creatures. Use mouse to rotate and mouse wheel to zoom.
</p>


<div id="model-container">
  <style>
    body {
      background-color: black; /* Transparent background */
      margin: 0;
      padding: 0;
      font-family: 'Merriweather', sans-serif;
    }
    #model-container {
      width: 2400px;  /* Define the width */
      height: 1200px;  /* Define the height */
      margin: 0 auto;  /* Center the div */
      border: none;  /* No border */
      background-color: transparent; /* Make model container background transparent */
    }
    #title {
      text-align: center;
      font-size: 64px;
      margin-top: 20px;
      color: white;
    }
    #description {
      text-align: center;
      font-size: 24px;
      margin: 20px auto;
      width: 800px;
      color: white;
    }
  </style>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>  <!-- OrbitControls -->


<script src="assets/js/threejs-model.js"></script>

</body>
</html>
